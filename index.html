<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOVA STORE - تيشيرت بلادي وافتخر</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #111;
}

header {
    background: #111;
    color: white;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 20px;
    font-weight: bold;
}

.cart-button {
    background: white;
    color: #111;
    border: none;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 15px;
}

.hero {
    background: white;
    text-align: center;
    padding: 25px 15px;
}

.hero h1 {
    margin: 5px 0;
    font-size: 28px;
}

.hero p {
    color: #666;
}

.product {
    background: white;
    width: 92%;
    max-width: 500px;
    margin: 20px auto;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

.product-image {
    width: 100%;
    height: 380px;
    object-fit: cover;
    display: block;
}

.product-info {
    padding: 20px;
}

.product-title {
    font-size: 25px;
    margin: 0 0 10px;
}

.description {
    color: #666;
    line-height: 1.7;
}

.old-price {
    text-decoration: line-through;
    color: #888;
    margin-left: 10px;
}

.price {
    font-size: 30px;
    font-weight: bold;
}

.add {
    width: 100%;
    background: #111;
    color: white;
    border: none;
    padding: 15px;
    border-radius: 12px;
    font-size: 18px;
}

.features {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 20px;
    text-align: center;
}

.feature {
    font-size: 13px;
    padding: 10px;
    background: #f5f5f5;
    border-radius: 10px;
}

.cart {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    z-index: 10;
}

.cart-box {
    background: white;
    width: 92%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    margin: 25px auto;
    padding: 20px;
    border-radius: 18px;
}

.close {
    float: left;
    border: none;
    background: none;
    font-size: 25px;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #ddd;
    padding: 15px 0;
}

.qty button {
    border: none;
    background: #eee;
    padding: 6px 10px;
    border-radius: 6px;
}

.delete {
    margin-top: 5px;
    background: none !important;
    color: red !important;
}

.total {
    font-size: 22px;
    margin: 20px 0;
}

.checkout {
    width: 100%;
    padding: 14px;
    background: #111;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 17px;
}

#orderForm {
    display: none;
    margin-top: 20px;
}

#orderForm input,
#orderForm textarea {
    width: 100%;
    padding: 13px;
    margin: 6px 0;
    border: 1px solid #ddd;
    border-radius: 9px;
    font-size: 16px;
}

#orderForm textarea {
    height: 80px;
}

.whatsapp {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    background: #25D366;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 17px;
}

</style>
<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<div class="logo">
NOVA STORE 🛍️
</div>

<button class="cart-button" onclick="openCart()">
🛒 السلة (<span id="count">0</span>)
</button>

</header>


<section class="hero">

<h1>🇲🇦 بلادي وافتخر</h1>

<p>تصميم مغربي عصري بروح مختلفة</p>

</section>


<div class="product">

<img
class="product-image"
src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=800"
alt="تيشيرت بلادي وافتخر"
>

<div class="product-info">

<h2 class="product-title">
تيشيرت بلادي وافتخر 🇲🇦
</h2>

<p class="description">
تيشيرت أسود بتصميم مستوحى من الهوية المغربية،
بسيط وعصري ومناسب للاستعمال اليومي.
</p>

<div>

<span class="old-price">
199 DH
</span>

<span class="price">
149 DH
</span>

</div>

<br>

<button class="add" onclick="addToCart()">
إضافة إلى السلة 🛒
</button>


<div class="features">

<div class="feature">
🚚<br>
توصيل
</div>

<div class="feature">
💵<br>
الدفع عند الاستلام
</div>

<div class="feature">
📱<br>
دعم واتساب
</div>

</div>

</div>

</div>


<div id="cart" class="cart">

<div class="cart-box">

<button class="close" onclick="closeCart()">
✕
</button>

<h2>🛒 سلة المشتريات</h2>

<div id="items"></div>

<div class="total">
المجموع:
<strong>
<span id="total">0</span> DH
</strong>
</div>

<button class="checkout" onclick="showOrder()">
إتمام الطلب 📦
</button>


<div id="orderForm">

<h3>📦 معلومات التوصيل</h3>

<input
id="name"
type="text"
placeholder="الاسم الكامل"
>

<input
id="phone"
type="tel"
placeholder="رقم الهاتف"
>

<input
id="city"
type="text"
placeholder="المدينة"
>

<textarea
id="address"
placeholder="العنوان بالتفصيل"
></textarea>

<button
class="whatsapp"
onclick="sendOrder()"
>
إرسال الطلب عبر واتساب 📲
</button>

</div>

</div>

</div>


<script>

let quantity =
Number(localStorage.getItem("nova_quantity")) || 0;


function save() {

localStorage.setItem(
"nova_quantity",
quantity
);

}


function addToCart() {

quantity++;

save();

updateCart();

alert("تمت إضافة التيشيرت إلى السلة 🛒");

}


function increase() {

quantity++;

save();

updateCart();

}


function decrease() {

if (quantity > 0) {

quantity--;

}

save();

updateCart();

}


function removeItem() {

quantity = 0;

save();

updateCart();

}


function updateCart() {

document.getElementById("count")
.innerText = quantity;

document.getElementById("total")
.innerText = quantity * 149;


let items =
document.getElementById("items");


if (quantity === 0) {

items.innerHTML =
"<p>السلة فارغة 🛒</p>";

return;

}


items.innerHTML = `

<div class="cart-item">

<div>

<strong>
تيشيرت بلادي وافتخر 🇲🇦
</strong>

<br>

149 DH

</div>

<div class="qty">

<button onclick="decrease()">
−
</button>

${quantity}

<button onclick="increase()">
+
</button>

<br>

<button
class="delete"
onclick="removeItem()"
>
🗑️ حذف
</button>

</div>

</div>

`;

}


function openCart() {

document.getElementById("cart")
.style.display = "block";

updateCart();

}


function closeCart() {

document.getElementById("cart")
.style.display = "none";

}


function showOrder() {

if (quantity === 0) {

alert("السلة فارغة 🛒");

return;

}

document.getElementById("orderForm")
.style.display = "block";

}


function sendOrder() {

let name =
document.getElementById("name")
.value.trim();

let phone =
document.getElementById("phone")
.value.trim();

let city =
document.getElementById("city")
.value.trim();

let address =
document.getElementById("address")
.value.trim();


if (!name || !phone || !city || !address) {

alert("يرجى ملء جميع البيانات.");

return;

}


let total = quantity * 149;


let message =
"🛍️ طلب جديد من NOVA STORE\n\n";


message +=
"👕 المنتج: تيشيرت بلادي وافتخر\n";

message +=
"🔢 الكمية: " +
quantity +
"\n";

message +=
"💰 المجموع: " +
total +
" DH\n\n";

message +=
"👤 الاسم: " +
name +
"\n";

message +=
"📱 الهاتف: " +
phone +
"\n";

message +=
"🏙️ المدينة: " +
city +
"\n";

message +=
"📍 العنوان: " +
address;


let whatsappURL =
"https://wa.me/212722224905?text=" +
encodeURIComponent(message);


window.location.href =
whatsappURL;

}


updateCart();

</script>

</body>

</html>
